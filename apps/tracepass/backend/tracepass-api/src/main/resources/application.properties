spring.application.name=tracepass-api

spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${TRACEPASS_DB_PORT:5432}/${TRACEPASS_DB_NAME:tracepass}
spring.datasource.username=${TRACEPASS_DB_USER:tracepass}
spring.datasource.password=${TRACEPASS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always